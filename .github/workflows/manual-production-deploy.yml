name: Production Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_o1AlkW6gIi1uDdHuVEWXGulE
      VERCEL_PROJECT_ID: prj_eQHqDfnZ6rmMtbtYPsNzEBuM60Uv
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run regression tests
        run: node --test tests/*.test.mjs

      - name: Type-check
        run: npx tsc --noEmit

      - name: Install Vercel CLI
        run: npm install --global vercel

      - name: Configure Vercel project
        run: |
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json

      - name: Pull production settings
        run: vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Sync compact Pickaxe coach configuration
        id: sync_pickaxe
        continue-on-error: true
        run: node --env-file=.vercel/.env.production.local scripts/sync-pickaxe-compact-coach.mjs

      - name: Note deferred Pickaxe sync
        if: steps.sync_pickaxe.outcome == 'failure'
        run: echo "Pickaxe prompt sync was deferred because the configured workspace credential was rejected. Continuing the app deployment without changing the live Pickaxe prompt."

      - name: Upload pre-compact Pickaxe prompt backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pickaxe-coach-prompt-backup
          path: .pickaxe-backup/ai-fitness-coach-role-before-compact.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Build on GitHub Actions
        run: vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy prebuilt output to production
        run: vercel deploy --prebuilt --prod --yes --archive=tgz --token="${{ secrets.VERCEL_TOKEN }}"
