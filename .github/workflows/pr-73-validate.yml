name: Validate PR 73 member signup bridge

on:
  push:
    branches:
      - fix/member-signup-identity-bridge
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Handoff regression tests
        run: npm run test:handoff

      - name: Next.js production build
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_cHJvLWVsay0yNzYxLmNsZXJrLmFjY291bnRzLmRldiQ
        run: npm run build
