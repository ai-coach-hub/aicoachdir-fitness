name: Workout history fix verification

on:
  push:
    branches:
      - fix/workout-history-plan-context-fallback
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run workout history route tests
        run: node --experimental-strip-types --test tests/workout-history-route.test.mjs
