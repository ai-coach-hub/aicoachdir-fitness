name: Subscription transition safety tests

on:
  pull_request:
    paths:
      - 'lib/subscriptionTransitionPolicy.mjs'
      - 'lib/subscriptionUpgradePreview.mjs'
      - 'tests/subscription-transition-policy.test.mjs'
      - 'tests/subscription-upgrade-preview.test.mjs'
      - '.github/workflows/subscription-transition-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  subscription-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout reviewed code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Run subscription safety tests
        run: node --test tests/subscription-transition-policy.test.mjs tests/subscription-upgrade-preview.test.mjs
